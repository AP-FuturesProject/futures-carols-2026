# Static site: nothing to build, publish the repo root as-is.
[build]
  publish = "."
  command = ""
  # Skip the build (and its credits) when a commit only touches files the live site doesn't use,
  # such as README.md or the editable source in src/. Exit code 0 means "skip".
  ignore = "git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- index.html assets netlify.toml"

# Let browsers keep images and scripts for a week so repeat visitors download almost nothing.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
