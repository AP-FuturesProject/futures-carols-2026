<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Futures Carols 2026</title>
  <meta name="theme-color" content="#f73b1a">
  <meta name="description" content="Futures Carols 2026 — pick your location and join us for a night of Christmas carols.">
  <link rel="icon" href="assets/carols-logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Condensed:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f73b1a;
      --bg-soft: #7a1507;
      --card: #8a1808;
      --glow: #ff7a50;
      --bg-deep: #b02a13;
      --on-bg: #fff1d2; /* cream for text and outlines sitting directly on the bright background */
      --display: 'Libre Caslon Condensed', Georgia, serif;
      --display-tracking: -0.04em; /* -40 in design-tool tracking units */
      --gold: #d9b45f;
      --gold-light: #f0d795;
      --text: #f4efe4;
      --muted: #ffe3d6;
      --line: rgba(217, 180, 95, 0.28);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; background: var(--bg); }
    html, body { overflow-x: clip; }
    body {
      margin: 0;
      /* Flat #f73b1a like the A5 design, easing darker toward the bottom (design bottom edge is about #ab2812) */
      background: linear-gradient(180deg, var(--bg) 0%, var(--bg) 40%, var(--bg-deep) 100%) no-repeat, var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
    }
    .wrap { width: min(960px, 100% - 32px); margin-inline: auto; }
    h1, h2, h3 { font-family: var(--display); letter-spacing: var(--display-tracking); font-weight: 500; margin: 0; }

    /* Hero */
    header { position: relative; text-align: center; padding: 48px 0 24px; }
    header > *:not(.star) { position: relative; z-index: 1; }
    .star { position: absolute; height: auto; pointer-events: none; z-index: 0; filter: drop-shadow(0 0 14px rgba(255, 214, 120, .35)); }
    /* Accent stars placed in open space further down the page (full-width layer per section, behind the content) */
    .deco { position: absolute; top: 0; bottom: 0; left: 50%; width: 100vw; transform: translateX(-50%); pointer-events: none; z-index: 0; }
    .star-d { width: clamp(64px, 9vw, 120px); left: 5%; top: 18%; transform: rotate(-14deg); }
    .star-e { width: clamp(56px, 7vw, 100px); right: 3%; top: 38%; transform: rotate(16deg); }
    #locations { position: relative; }
    .star-c { display: block; width: 44px; height: auto; margin: 0 auto 16px; filter: drop-shadow(0 0 10px rgba(255, 214, 120, .35)); }
    .logo-wrap { position: relative; width: min(560px, 90%); margin-inline: auto; line-height: 0; filter: drop-shadow(0 0 28px rgba(255, 214, 120, 0.3)); }
    .logo { width: 100%; height: auto; }
    /* Gold reflection: a bright band swept across the logo, clipped to the logo's own shape */
    .sheen {
      position: absolute; inset: 0; pointer-events: none;
      -webkit-mask: url(assets/carols-logo.webp) center / 100% 100% no-repeat;
              mask: url(assets/carols-logo.webp) center / 100% 100% no-repeat;
      background: linear-gradient(105deg, transparent 43%, rgba(255, 248, 214, .95) 50%, transparent 57%) 100% 0 / 300% 100% no-repeat;
      animation: sheen 5s ease-in-out infinite;
    }
    @keyframes sheen {
      0%   { background-position: 100% 0; }
      55%, 100% { background-position: 0% 0; }
    }
    .eyebrow {
      letter-spacing: .35em; text-transform: uppercase; font-size: .8rem;
      color: var(--on-bg); margin: 8px 0 0;
    }
    .tagline { color: var(--muted); max-width: 52ch; margin: 16px auto 0; }

    section { padding: 40px 0; }
    .section-title {
      text-wrap: balance; line-height: 1.15;
      font-size: clamp(2.1rem, 6.5vw, 3rem); text-align: center; color: var(--on-bg); margin-bottom: 24px;
      background: linear-gradient(100deg, #ffe7a3 40%, #ffffff 50%, #ffe7a3 60%) 100% 0 / 250% 100% no-repeat;
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 6s ease-in-out infinite;
    }
    @keyframes shine {
      0%   { background-position: 100% 0; }
      50%, 100% { background-position: 0% 0; }
    }

    .section-note { margin: -12px 0 22px; text-align: center; font-size: .85rem; letter-spacing: .04em; color: var(--muted); }
    /* Video section: full-bleed darker band with a straight top edge; the spark rises out of the middle of it.
       The star is the brand artwork used as a mask, so its outline is exact. Its lower half sits inside the band. */
    .video-band { --star: 380px; --band: #4a0f06; position: relative; isolation: isolate; margin-top: calc(var(--star) * .34); }
    .video-band::before { content: ''; position: absolute; left: 50%; width: 100vw; transform: translateX(-50%); top: 0; bottom: 0; z-index: -1; background: var(--band); }
    .video-band::after {
      content: ''; position: absolute; left: 50%; top: 0; z-index: -1; width: var(--star); height: calc(var(--star) * .885); transform: translate(-50%, -36%);
      background: var(--band);
      -webkit-mask: url(assets/star.webp) center / contain no-repeat; mask: url(assets/star.webp) center / contain no-repeat;
    }
    /* Video */
    .video {
      position: relative; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden;
      border: 1px solid var(--line); background: var(--bg-soft);
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }
    .video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .video-placeholder {
      position: absolute; inset: 0; display: grid; place-content: center; gap: 8px;
      text-align: center; color: var(--muted); padding: 16px;
    }
    .video-placeholder svg { width: 64px; height: 64px; margin-inline: auto; fill: none; stroke: var(--gold); stroke-width: 1.5; }
    /* Replace the placeholder with a Vimeo iframe — see the comment in the markup. */

    /* Location picker */
    .picker { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 0; padding: 0; list-style: none; }
    .picker button {
      font: inherit; font-weight: 500; cursor: pointer;
      padding: 14px 26px; border-radius: 999px;
      color: var(--on-bg); background: transparent;
      border: 1px solid var(--on-bg);
      transition: background .2s, color .2s, transform .2s;
    }
    @media (hover: hover) { .picker button:hover { background: rgba(255, 241, 210, .16); transform: translateY(-1px); } }
    .picker button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    .picker button[aria-expanded="true"] { background: var(--gold); color: #1a1405; }
    /* Featured location: own row, larger, always filled gold */
    .picker li.featured { flex: 0 0 100%; display: flex; justify-content: center; margin-bottom: 4px; }
    .picker li.featured button {
      font-size: 1.4rem; font-weight: 600; padding: 20px 52px;
      background: linear-gradient(180deg, var(--gold-light), var(--gold)); color: #1a1405;
      box-shadow: 0 0 28px rgba(255, 214, 120, .4);
    }
    /* Paradise extras: star in the label, a light sweep across the button, and a slow glowing halo */
    .picker li.featured button { position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: 12px; animation: halo 3.2s ease-in-out infinite; }
    .picker li.featured button .btn-star { width: 1.5em; height: auto; flex: none; filter: drop-shadow(0 0 4px rgba(120, 60, 0, .35)); }
    .picker li.featured button::after { content: ''; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 38%, rgba(255, 255, 255, .4) 50%, transparent 62%) 140% 0 / 250% 100% no-repeat; animation: btnsweep 4.5s ease-in-out infinite; pointer-events: none; }
    @keyframes btnsweep { 0%, 35% { background-position: 140% 0; } 75%, 100% { background-position: -40% 0; } }
    @keyframes halo { 0%, 100% { box-shadow: 0 0 22px rgba(255, 214, 120, .35); } 50% { box-shadow: 0 0 46px 6px rgba(255, 214, 120, .65); } }
    @media (prefers-reduced-motion: reduce) { .picker li.featured button, .picker li.featured button::after { animation: none; } }
    @media (hover: hover) { .picker li.featured button:hover { background: linear-gradient(180deg, #fff3c8, var(--gold-light)); } }
    .picker li.featured button[aria-expanded="true"] { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px #fff, 0 0 28px rgba(255, 214, 120, .5); }

    .picker button { touch-action: manipulation; min-height: 48px; -webkit-tap-highlight-color: transparent; }
    .panels { margin-top: 28px; }
    .panel { scroll-margin-top: 12px; }
    .panel {
      background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      padding: clamp(20px, 4vw, 36px);
      animation: reveal .35s ease;
    }
    .panel[hidden] { display: none; }
    @keyframes reveal { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .panel h3 { display: flex; align-items: center; gap: 12px; font-size: 2.4rem; color: var(--gold-light); margin-bottom: 4px; }
    .panel h3 .spark { width: 1.35em; height: auto; flex: none; filter: drop-shadow(0 0 8px rgba(255, 214, 120, .45)); }
    .panel .sub { color: var(--muted); margin: 0 0 20px; }
    .details { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; margin: 0 0 20px; }
    .details div { border-left: 2px solid var(--gold); padding-left: 14px; }
    .details dt { font-size: .75rem; letter-spacing: .15em; text-transform: uppercase; color: var(--gold); }
    .details dd { margin: 2px 0 0; }
    .tbc { color: var(--muted); font-style: italic; }
    .btn {
      display: inline-block; padding: 12px 22px; border-radius: 999px; text-decoration: none;
      background: var(--gold); color: #1a1405; font-weight: 600;
    }
    @media (hover: hover) { .btn:hover { background: var(--gold-light); } }
    .btn:focus-visible { outline: 3px solid var(--gold-light); outline-offset: 3px; }


    /* Event details */
    .countdown { display: flex; flex-wrap: wrap; gap: 12px; margin: 0 0 24px; }
    .countdown .unit { min-width: 76px; text-align: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: rgba(0,0,0,.18); }
    .countdown b { display: block; font-family: var(--display); letter-spacing: var(--display-tracking); font-size: 2rem; font-weight: 600; line-height: 1.1; color: var(--gold-light); font-variant-numeric: tabular-nums; }
    .countdown span { font-size: .7rem; letter-spacing: .15em; text-transform: uppercase; color: var(--muted); }
    .countdown-note { color: var(--gold-light); font-family: var(--display); letter-spacing: var(--display-tracking); font-size: 1.5rem; margin: 0 0 24px; }
    .dates { font-family: var(--display); letter-spacing: var(--display-tracking); font-size: clamp(1.6rem, 5vw, 2.2rem); color: var(--text); margin: 0 0 20px; }
    .dates em { color: var(--gold); font-style: normal; padding: 0 .25em; }
    .schedule { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin: 0 0 24px; padding: 0; list-style: none; }
    .schedule li { border-left: 2px solid var(--gold); padding-left: 14px; }
    .schedule .time { display: block; font-family: var(--display); letter-spacing: var(--display-tracking); font-size: 2.4rem; line-height: 1; font-weight: 600; color: var(--gold-light); }
    .schedule .what { font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 24px; padding: 0; list-style: none; }
    .chips li { padding: 6px 14px; border-radius: 999px; font-size: .9rem; border: 1px solid var(--line); background: rgba(0,0,0,.18); }
    .where { margin: 0 0 20px; }
    .where strong { display: block; letter-spacing: .1em; text-transform: uppercase; font-size: .85rem; color: var(--gold); font-weight: 500; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; }
    .btn.ghost { background: transparent; color: var(--gold-light); border: 1px solid var(--gold); }
    @media (hover: hover) { .btn.ghost:hover { background: rgba(217, 180, 95, .12); } }


    /* Photo carousel (WebGL, from the FlexCarousel component): full-bleed row under the title */
    .carousel-wrap { width: 100vw; margin: 20px calc(50% - 50vw) 0; }
    .carousel { width: 100%; height: 420px; }
    .flex-carousel { position: relative; overflow: hidden; cursor: grab; touch-action: pan-y; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; outline: none; }
    .flex-carousel[data-hover='open'] { cursor: zoom-in; }
    .flex-carousel[data-hover='close'] { cursor: zoom-out; }
    .flex-carousel[data-dragging] { cursor: grabbing; }
    .flex-carousel:focus-visible { box-shadow: inset 0 0 0 2px rgba(255, 241, 210, .7); }
    .flex-carousel__caption { position: absolute; left: 0; right: 0; top: calc(50% + var(--flex-carousel-half) * var(--flex-carousel-lift, 1) + 18px); display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0 16px; pointer-events: none; text-align: center; animation: flex-carousel-reveal 900ms ease both; }
    .flex-carousel__title { display: none; } /* image titles are hidden; only the 01 / 08 counter shows */
    .flex-carousel__count { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; line-height: 1; font-variant-numeric: tabular-nums; color: var(--on-bg); opacity: .7; transition: opacity 400ms ease; }
    .flex-carousel__count[data-hidden] { opacity: 0; }
    .flex-carousel__digits { display: inline-flex; }
    .flex-carousel__digit { display: inline-block; height: 1em; overflow: hidden; }
    .flex-carousel__reel { display: flex; flex-direction: column; transition: transform 600ms cubic-bezier(0.22, 1, 0.36, 1); }
    .flex-carousel__reel span { height: 1em; }
    .flex-carousel__slash { opacity: .6; }
    .flex-carousel__live { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    @keyframes flex-carousel-reveal { from { opacity: 0; } to { opacity: 1; } }
    @media (min-width: 640px) { .carousel { height: 600px; } }
    @media (prefers-reduced-motion: reduce) { .flex-carousel__caption { animation: none; } .flex-carousel__reel { transition: none; } }

    /* Light rays: decorative glow from the top of the page, behind the header content */
    .light-rays { position: absolute; top: 0; left: 0; width: 100%; height: min(78vh, 640px); z-index: 0; pointer-events: none; overflow: hidden; opacity: .6; mix-blend-mode: screen;
      -webkit-mask-image: linear-gradient(to bottom, #000 55%, transparent 100%); mask-image: linear-gradient(to bottom, #000 55%, transparent 100%); }
    .light-rays canvas { pointer-events: none; }
    /* Particles: decorative overlay above the page, never receives input */
    .particles-layer { position: fixed; inset: 0; z-index: 900; pointer-events: none; overflow: hidden; }
    .particles-canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; pointer-events: none; }
    /* Glow cursor: full-viewport overlay, never intercepts the mouse */
    .glow-cursor { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .glow-cursor--page { position: fixed; inset: 0; z-index: 9999; pointer-events: none; }
    .glow-cursor__canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; pointer-events: none; user-select: none; }

    /* Phones (priority): tighter spacing, grid picker, stacked dates, full-width actions */
    @media (max-width: 639px) {
      header { padding: 72px 0 8px; }
      .star-d { display: none; }
      .star-e { width: 40px; right: 8%; top: 22px; }
      .tagline { font-size: 1.05rem; }
      section { padding: 28px 0; }
      .section-title { margin-bottom: 18px; }
      .picker { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .picker li { display: flex; }
      .picker li.featured { grid-column: 1 / -1; margin-bottom: 4px; }
      .picker li:last-child:nth-child(even) { grid-column: 1 / -1; }
      .picker button { width: 100%; padding: 12px 10px; line-height: 1.25; font-size: 1rem; }
      .picker li.featured button { font-size: 1.3rem; padding: 18px 24px; }
      .panel { padding: 20px 18px; }
      .countdown { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
      .countdown .unit { min-width: 0; padding: 10px 4px; }
      .dates { display: flex; flex-direction: column; gap: 2px; }
      .dates em { display: none; }
      .schedule { gap: 14px; }
      .actions .btn { flex: 1 1 100%; text-align: center; padding: 14px 22px; }
      .video { border-radius: 12px; }
      .video-band { --star: 220px; }
      footer { padding: 28px 0 40px; }
    }

    footer { position: relative; isolation: isolate; text-align: center; color: #cfc6bd; font-size: .85rem; padding: 40px 0 56px; margin-top: 0; }
    footer::before { content: ''; position: absolute; top: 0; bottom: 0; left: -100vw; right: -100vw; z-index: -1; background: #000; box-shadow: inset 0 1px 0 rgba(217, 180, 95, .35); }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .panel, .sheen, .section-title { animation: none; }
      .sheen { display: none; }
      .picker button { transition: none; }
    }
  </style>
</head>
<body>

  <header class="wrap">
    <div class="logo-wrap">
      <img class="logo" src="assets/carols-logo.webp" alt="Futures Carols" width="1540" height="969">
      <span class="sheen" aria-hidden="true"></span>
    </div>
    <p class="eyebrow">Presented by Futures Church</p>
    <div class="carousel-wrap"><div id="photo-carousel" class="carousel"></div></div>
  </header>

  <main>
    <section class="wrap" id="locations" aria-labelledby="loc-title">
      <div class="deco" aria-hidden="true"><img class="star star-d" src="assets/star.webp" alt=""></div>
      <h2 id="loc-title" class="section-title">Find a Futures Carols Near You!</h2>
      <p class="section-note">Click a location below for more information</p>

      <ul class="picker" id="picker"></ul>

      <div class="panels" id="panels"></div>
    </section>

    <section class="wrap video-band" aria-labelledby="video-title">
      <div class="deco" aria-hidden="true"><img class="star star-e" src="assets/star.webp" alt=""></div>
      <h2 id="video-title" class="section-title">Watch</h2>
      <div class="video">
        <!--
          VIMEO EMBED: replace the .video-placeholder div below with:
          <iframe src="https://player.vimeo.com/video/YOUR_VIDEO_ID?dnt=1"
                  allow="autoplay; fullscreen; picture-in-picture"
                  allowfullscreen title="Futures Carols 2026"></iframe>
        -->
        <div class="video-placeholder">
          <svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="29"/><path d="M26 20l20 12-20 12z"/></svg>
          <strong>Video coming soon</strong>
          <span>Vimeo embed placeholder</span>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap">
      <img class="star-c" src="assets/star.webp" alt="" aria-hidden="true">
      &copy; 2026 Futures Church. All rights reserved.</div>
  </footer>

  <script>
    (function () {
      var TZ = 'Australia/Adelaide';

      // One entry per location. Fill in the rest the same way as Paradise.
      // Times are Adelaide time; Dec is daylight saving (+10:30).
      var LOCATIONS = [
        {
          id: 'paradise', name: 'Paradise', featured: true,
          dates: [
            { start: '2026-12-12T17:30:00+10:30' },
            { start: '2026-12-13T17:30:00+10:30' }
          ],
          schedule: [
            { time: '5:30pm', what: 'Food & kids activities' },
            { time: '7:00pm', what: 'Carols show' }
          ],
          highlights: ['Photos with Santa', 'Kids activities', 'Candles & glow sticks', 'Food trucks', 'Face painting', 'Fun for all ages'],
          address: '57 Darley Road, Paradise',
          mapsQuery: '57 Darley Road, Paradise SA',
          website: 'https://www.futures.church'
        },
        { id: 'copper-coast', name: 'Copper Coast' },
        { id: 'victor-harbor', name: 'Victor Harbor' },
        { id: 'adelaide-city', name: 'Adelaide City' },
        { id: 'south', name: 'South (Old Reynella)' },
        { id: 'clare-valley', name: 'Clare Valley' }
      ];

      var picker = document.getElementById('picker');
      var panelsEl = document.getElementById('panels');
      var timer = null;

      function el(tag, cls, text) {
        var n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text != null) n.textContent = text;
        return n;
      }
      function fmt(iso, opts) {
        return new Intl.DateTimeFormat('en-AU', Object.assign({ timeZone: TZ }, opts)).format(new Date(iso));
      }
      function datesLine(loc) {
        var line = el('p', 'dates');
        loc.dates.forEach(function (d, i) {
          if (i) line.appendChild(el('em', null, '+'));
          line.appendChild(el('span', null, fmt(d.start, { weekday: 'long', day: 'numeric', month: 'long' })));
        });
        return line;
      }

      function buildCountdown(loc) {
        var first = new Date(loc.dates[0].start).getTime();
        // Event is over after the evening of the last date (assumed ~10pm).
        var last = new Date(loc.dates[loc.dates.length - 1].start).getTime() + 4.5 * 3600e3;
        var box = el('div');
        box.dataset.countdown = '1';
        function tick() {
          var now = Date.now(), diff = first - now;
          box.textContent = '';
          if (now > last) { box.appendChild(el('p', 'countdown-note', 'Thanks for celebrating with us. See you next year!')); return; }
          if (diff <= 0) { box.appendChild(el('p', 'countdown-note', 'It\u2019s on now. Come on down!')); return; }
          var wrap = el('div', 'countdown');
          wrap.setAttribute('role', 'timer');
          var s = Math.floor(diff / 1000);
          [['Days', Math.floor(s / 86400)], ['Hours', Math.floor(s % 86400 / 3600)], ['Mins', Math.floor(s % 3600 / 60)], ['Secs', s % 60]].forEach(function (u) {
            var cell = el('div', 'unit');
            cell.appendChild(el('b', null, String(u[1]).padStart(2, '0')));
            cell.appendChild(el('span', null, u[0]));
            wrap.appendChild(cell);
          });
          box.appendChild(wrap);
        }
        tick();
        box.tick = tick;
        return box;
      }

      function buildPanel(loc) {
        var p = el('article', 'panel');
        p.id = loc.id; p.hidden = true;
        var title = el('h3');
        var spark = el('img', 'spark');
        spark.src = 'assets/star.webp'; spark.alt = ''; spark.setAttribute('aria-hidden', 'true');
        title.appendChild(spark);
        title.appendChild(document.createTextNode(loc.name));
        p.appendChild(title);
        p.appendChild(el('p', 'sub', 'Futures Carols 2026'));

        if (!loc.dates) {
          var dl = el('dl', 'details');
          ['Date', 'Time', 'Venue', 'Address'].forEach(function (k) {
            var d = el('div');
            d.appendChild(el('dt', null, k));
            d.appendChild(el('dd', 'tbc', 'To be confirmed'));
            dl.appendChild(d);
          });
          p.appendChild(dl);
          return p;
        }

        p.appendChild(buildCountdown(loc));
        p.appendChild(datesLine(loc));

        var sched = el('ul', 'schedule');
        loc.schedule.forEach(function (it) {
          var li = el('li');
          li.appendChild(el('span', 'time', it.time));
          li.appendChild(el('span', 'what', it.what));
          sched.appendChild(li);
        });
        p.appendChild(sched);

        var chips = el('ul', 'chips');
        loc.highlights.forEach(function (h) { chips.appendChild(el('li', null, h)); });
        p.appendChild(chips);

        var where = el('p', 'where');
        where.appendChild(el('strong', null, 'Where'));
        where.appendChild(document.createTextNode(loc.address));
        p.appendChild(where);

        var actions = el('div', 'actions');
        var dir = el('a', 'btn', 'Get directions');
        dir.href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(loc.mapsQuery);
        dir.target = '_blank'; dir.rel = 'noopener';
        actions.appendChild(dir);
        var web = el('a', 'btn ghost', 'futures.church');
        web.href = loc.website; web.target = '_blank'; web.rel = 'noopener';
        actions.appendChild(web);
        p.appendChild(actions);
        return p;
      }

      LOCATIONS.forEach(function (loc) {
        var li = el('li', loc.featured ? 'featured' : null);
        var b = el('button', null);
        if (loc.featured) {
          var st = el('img', 'btn-star');
          st.src = 'assets/star.webp'; st.alt = ''; st.setAttribute('aria-hidden', 'true');
          b.appendChild(st);
        }
        b.appendChild(document.createTextNode(loc.name));
        b.type = 'button';
        b.setAttribute('aria-expanded', 'false');
        b.setAttribute('aria-controls', loc.id);
        li.appendChild(b);
        picker.appendChild(li);
        panelsEl.appendChild(buildPanel(loc));
      });

      function show(id) {
        clearInterval(timer);
        document.querySelectorAll('.panel').forEach(function (p) { p.hidden = p.id !== id; });
        document.querySelectorAll('.picker button').forEach(function (b) {
          b.setAttribute('aria-expanded', String(b.getAttribute('aria-controls') === id));
        });
        var cd = id && document.querySelector('#' + id + ' [data-countdown]');
        if (cd) timer = setInterval(cd.tick, 1000);
      }

      picker.addEventListener('click', function (e) {
        var b = e.target.closest('button');
        if (!b) return;
        var id = b.getAttribute('aria-controls');
        var open = b.getAttribute('aria-expanded') === 'true';
        show(open ? null : id);
        if (!open) document.getElementById(id).scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    })();
  </script>
  <script src="assets/flex-carousel.js"></script>
  <script>
    (function () {
      var el = document.getElementById('photo-carousel');
      if (!window.FlexCarousel || !el) return;
      var small = window.matchMedia('(max-width: 639px)').matches;
      // To change the photos: put files in assets/carousel/ and edit this list (alt text is read aloud by screen readers).
      var photos = [
        { src: 'assets/carousel/photo-1.webp', alt: 'Kids and a reindeer performer on stage with arms raised in front of a snowy backdrop' },
        { src: 'assets/carousel/photo-2.webp', alt: 'A woman smiling and singing into a microphone on stage, with a guitarist behind her' },
        { src: 'assets/carousel/photo-3.webp', alt: 'A band performing on stage under spotlights in front of a seated audience' },
        { src: 'assets/carousel/photo-4.webp', alt: 'Two girls smiling at the camera in the audience under purple light' },
        { src: 'assets/carousel/photo-5.webp', alt: 'Santa waving in the aisle of a packed auditorium' },
        { src: 'assets/carousel/photo-6.webp', alt: 'Kids with face paint posing with a Christmas elf outdoors' },
        { src: 'assets/carousel/photo-7.webp', alt: 'Children and families in the audience with glow sticks, clapping and smiling' },
        { src: 'assets/carousel/photo-8.webp', alt: 'A packed auditorium watching the stage from the back' },
        { src: 'assets/carousel/photo-9.webp', alt: 'A singer in a gold dress and dancers in green polka-dot dresses on stage' }
      ];
      // Settings follow the component's 'arch' look: cards ride an arch-shaped lens and squeeze together as they slide.
      var cardH = small ? 0.44 : 0.46;
      var room = (el.clientHeight * (1 - cardH)) / 2; // vertical headroom above and below the middle card
      var bend = Math.min(0.2, (1.5 * room) / Math.max(el.clientWidth, 1));
      window.FlexCarousel(el, {
        items: photos,
        label: 'Futures Carols photos',
        preset: 'arch',
        intro: 'rise',
        cardHeight: cardH,
        bend: bend, // scaled to the available headroom so the lifted outer cards never reach the edge of the box
        gap: 12,
        squeeze: 0.2,
        focusOnClick: false, // photos do not open larger when clicked
        captions: false,
        autoplay: true,
        interval: 4,
        captureWheel: false
      });
    })();
  </script>
  <script src="assets/light-rays.js"></script>
  <script>
    (function () {
      if (!window.LightRays) return;
      var box = document.createElement('div');
      box.className = 'light-rays';
      box.setAttribute('aria-hidden', 'true');
      document.body.insertBefore(box, document.body.firstChild);
      window.LightRays(box, {
        raysOrigin: 'top-center',
        raysColor: '#ffe08a',
        raysSpeed: 0.8,
        lightSpread: 0.7,
        rayLength: 2.2,
        pulsating: false,
        fadeDistance: 1,
        saturation: 1,
        noiseAmount: 0,
        distortion: 0.04
      });
    })();
  </script>
  <script src="assets/particles.js"></script>
  <script>
    (function () {
      if (!window.Particles) return;
      var layer = document.createElement('div');
      layer.className = 'particles-layer';
      layer.setAttribute('aria-hidden', 'true');
      document.body.appendChild(layer);
      var small = window.matchMedia('(max-width: 639px)').matches;
      window.Particles(layer, {
        particleCount: small ? 90 : 170,
        particleSpread: 10,
        speed: 0.08,
        particleColors: ['#ffdb6b', '#f0d795', '#fff6cf'],
        particleBaseSize: small ? 70 : 90,
        sizeRandomness: 1,
        cameraDistance: 20,
        shape: 'circle',
        glow: 0.7,
        twinkle: 0.5,
        depthOfField: 0.3,
        drift: 'down',
        driftSpeed: 0.5,
        opacity: 0.85
      });
    })();
  </script>
  <script src="assets/glow-cursor.js"></script>
  <script>
    (function () {
      if (!window.GlowCursor || !window.matchMedia('(pointer: fine)').matches) return;
      var host = document.createElement('div');
      host.className = 'glow-cursor glow-cursor--page';
      document.body.appendChild(host);
      window.GlowCursor(host, {
        color: '#ffdb6b',
        intensity: 1.3,
        trailWidth: 7.5,
        linger: 0.7,
        glow: 1.45,
        clickBurst: false,
        theme: 'dark'
      });
    })();
  </script>
