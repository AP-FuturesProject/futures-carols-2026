<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Futures Carols 2026</title>
  <meta name="description" content="Futures Carols 2026 — pick your location and join us for a night of Christmas carols.">
  <link rel="icon" href="assets/carols-logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #7d0f1c;
      --bg-soft: #5e0a15;
      --card: #6a0c18;
      --glow: #b8222f;
      --gold: #d9b45f;
      --gold-light: #f0d795;
      --text: #f4efe4;
      --muted: #ecc9c3;
      --line: rgba(217, 180, 95, 0.28);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    html, body { overflow-x: clip; }
    body {
      margin: 0;
      background:
        radial-gradient(ellipse at 50% -10%, var(--glow) 0%, transparent 65%),
        var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { width: min(960px, 100% - 32px); margin-inline: auto; }
    h1, h2, h3 { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; margin: 0; }

    /* Hero */
    header { position: relative; text-align: center; padding: 48px 0 24px; }
    header > *:not(.star) { position: relative; z-index: 1; }
    .star { position: absolute; height: auto; pointer-events: none; z-index: 0; filter: drop-shadow(0 0 14px rgba(255, 214, 120, .35)); }
    .star-a { width: clamp(64px, 13vw, 130px); top: 28px; left: clamp(-24px, -2vw, 0px); transform: rotate(-14deg); }
    .star-b { width: clamp(90px, 20vw, 210px); top: 150px; right: clamp(-48px, -4vw, 0px); transform: rotate(18deg); }
    .star-c { display: block; width: 44px; height: auto; margin: 0 auto 16px; filter: drop-shadow(0 0 10px rgba(255, 214, 120, .35)); }
    .logo-wrap { position: relative; width: min(560px, 90%); margin-inline: auto; line-height: 0; filter: drop-shadow(0 0 28px rgba(255, 214, 120, 0.3)); }
    .logo { width: 100%; height: auto; }
    /* Gold reflection: a bright band swept across the logo, clipped to the logo's own shape */
    .sheen {
      position: absolute; inset: 0; pointer-events: none;
      -webkit-mask: url(assets/carols-logo.webp) center / 100% 100% no-repeat;
              mask: url(assets/carols-logo.webp) center / 100% 100% no-repeat;
      background: linear-gradient(105deg, transparent 43%, rgba(255, 248, 214, .95) 50%, transparent 57%) 100% 0 / 300% 100% no-repeat;
      animation: sheen 5s ease-in-out infinite;
    }
    @keyframes sheen {
      0%   { background-position: 100% 0; }
      55%, 100% { background-position: 0% 0; }
    }
    .eyebrow {
      letter-spacing: .35em; text-transform: uppercase; font-size: .8rem;
      color: var(--gold); margin: 8px 0 0;
    }
    .tagline { color: var(--muted); max-width: 52ch; margin: 16px auto 0; }

    section { padding: 40px 0; }
    .section-title {
      font-size: clamp(1.8rem, 5vw, 2.6rem); text-align: center; color: var(--gold-light); margin-bottom: 24px;
      background: linear-gradient(100deg, var(--gold) 40%, #fff6cf 50%, var(--gold) 60%) 100% 0 / 250% 100% no-repeat;
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 6s ease-in-out infinite;
    }
    @keyframes shine {
      0%   { background-position: 100% 0; }
      50%, 100% { background-position: 0% 0; }
    }

    /* Video */
    .video {
      position: relative; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden;
      border: 1px solid var(--line); background: var(--bg-soft);
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }
    .video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .video-placeholder {
      position: absolute; inset: 0; display: grid; place-content: center; gap: 8px;
      text-align: center; color: var(--muted); padding: 16px;
    }
    .video-placeholder svg { width: 64px; height: 64px; margin-inline: auto; fill: none; stroke: var(--gold); stroke-width: 1.5; }
    /* Replace the placeholder with a Vimeo iframe — see the comment in the markup. */

    /* Location picker */
    .picker { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 0; padding: 0; list-style: none; }
    .picker button {
      font: inherit; font-weight: 500; cursor: pointer;
      padding: 14px 26px; border-radius: 999px;
      color: var(--gold-light); background: transparent;
      border: 1px solid var(--gold);
      transition: background .2s, color .2s, transform .2s;
    }
    .picker button:hover { background: rgba(217, 180, 95, .12); transform: translateY(-1px); }
    .picker button:focus-visible { outline: 3px solid var(--gold-light); outline-offset: 3px; }
    .picker button[aria-expanded="true"] { background: var(--gold); color: #1a1405; }
    /* Featured location: own row, larger, always filled gold */
    .picker li.featured { flex: 0 0 100%; display: flex; justify-content: center; margin-bottom: 4px; }
    .picker li.featured button {
      font-size: 1.25rem; font-weight: 600; padding: 18px 48px;
      background: linear-gradient(180deg, var(--gold-light), var(--gold)); color: #1a1405;
      box-shadow: 0 0 28px rgba(255, 214, 120, .4);
    }
    .picker li.featured button:hover { background: linear-gradient(180deg, #fff3c8, var(--gold-light)); }
    .picker li.featured button[aria-expanded="true"] { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--gold-light), 0 0 28px rgba(255, 214, 120, .5); }

    .panels { margin-top: 28px; }
    .panel {
      background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      padding: clamp(20px, 4vw, 36px);
      animation: reveal .35s ease;
    }
    .panel[hidden] { display: none; }
    @keyframes reveal { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .panel h3 { font-size: 2rem; color: var(--gold-light); margin-bottom: 4px; }
    .panel .sub { color: var(--muted); margin: 0 0 20px; }
    .details { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; margin: 0 0 20px; }
    .details div { border-left: 2px solid var(--gold); padding-left: 14px; }
    .details dt { font-size: .75rem; letter-spacing: .15em; text-transform: uppercase; color: var(--gold); }
    .details dd { margin: 2px 0 0; }
    .tbc { color: var(--muted); font-style: italic; }
    .btn {
      display: inline-block; padding: 12px 22px; border-radius: 999px; text-decoration: none;
      background: var(--gold); color: #1a1405; font-weight: 600;
    }
    .btn:hover { background: var(--gold-light); }
    .btn:focus-visible { outline: 3px solid var(--gold-light); outline-offset: 3px; }


    /* Event details */
    .countdown { display: flex; flex-wrap: wrap; gap: 12px; margin: 0 0 24px; }
    .countdown .unit { min-width: 76px; text-align: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: rgba(0,0,0,.18); }
    .countdown b { display: block; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 2rem; font-weight: 600; line-height: 1.1; color: var(--gold-light); font-variant-numeric: tabular-nums; }
    .countdown span { font-size: .7rem; letter-spacing: .15em; text-transform: uppercase; color: var(--muted); }
    .countdown-note { color: var(--gold-light); font-family: 'Cormorant Garamond', Georgia, serif; font-size: 1.5rem; margin: 0 0 24px; }
    .dates { font-family: 'Cormorant Garamond', Georgia, serif; font-size: clamp(1.6rem, 5vw, 2.2rem); color: var(--text); margin: 0 0 20px; }
    .dates em { color: var(--gold); font-style: normal; padding: 0 .25em; }
    .schedule { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin: 0 0 24px; padding: 0; list-style: none; }
    .schedule li { border-left: 2px solid var(--gold); padding-left: 14px; }
    .schedule .time { display: block; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 2.4rem; line-height: 1; font-weight: 600; color: var(--gold-light); }
    .schedule .what { font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 24px; padding: 0; list-style: none; }
    .chips li { padding: 6px 14px; border-radius: 999px; font-size: .9rem; border: 1px solid var(--line); background: rgba(0,0,0,.18); }
    .where { margin: 0 0 20px; }
    .where strong { display: block; letter-spacing: .1em; text-transform: uppercase; font-size: .85rem; color: var(--gold); font-weight: 500; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; }
    .btn.ghost { background: transparent; color: var(--gold-light); border: 1px solid var(--gold); }
    .btn.ghost:hover { background: rgba(217, 180, 95, .12); }

    footer { text-align: center; color: var(--muted); font-size: .85rem; padding: 40px 0 56px; border-top: 1px solid var(--line); margin-top: 24px; }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .panel, .sheen, .section-title { animation: none; }
      .sheen { display: none; }
      .picker button { transition: none; }
    }
  </style>
</head>
<body>

  <header class="wrap">
    <img class="star star-a" src="assets/star.webp" alt="" aria-hidden="true">
    <img class="star star-b" src="assets/star.webp" alt="" aria-hidden="true">
    <div class="logo-wrap">
      <img class="logo" src="assets/carols-logo.webp" alt="Carols" width="1540" height="969">
      <span class="sheen" aria-hidden="true"></span>
    </div>
    <p class="eyebrow">Futures Church &middot; 2026</p>
    <p class="tagline">Join us for a night of Christmas carols, community and celebration.</p>
  </header>

  <main>
    <section class="wrap" id="locations" aria-labelledby="loc-title">
      <h2 id="loc-title" class="section-title">Pick a location:</h2>

      <ul class="picker" id="picker"></ul>

      <div class="panels" id="panels"></div>
    </section>

    <section class="wrap" aria-labelledby="video-title">
      <h2 id="video-title" class="section-title">Watch</h2>
      <div class="video">
        <!--
          VIMEO EMBED: replace the .video-placeholder div below with:
          <iframe src="https://player.vimeo.com/video/YOUR_VIDEO_ID?dnt=1"
                  allow="autoplay; fullscreen; picture-in-picture"
                  allowfullscreen title="Futures Carols 2026"></iframe>
        -->
        <div class="video-placeholder">
          <svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="29"/><path d="M26 20l20 12-20 12z"/></svg>
          <strong>Video coming soon</strong>
          <span>Vimeo embed placeholder</span>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap">
      <img class="star-c" src="assets/star.webp" alt="" aria-hidden="true">
      &copy; 2026 Futures Church. All rights reserved.</div>
  </footer>

  <script>
    (function () {
      var TZ = 'Australia/Adelaide';

      // One entry per location. Fill in the rest the same way as Paradise.
      // Times are Adelaide time; Dec is daylight saving (+10:30).
      var LOCATIONS = [
        {
          id: 'paradise', name: 'Paradise', featured: true,
          dates: [
            { start: '2026-12-12T17:30:00+10:30' },
            { start: '2026-12-13T17:30:00+10:30' }
          ],
          schedule: [
            { time: '5:30pm', what: 'Food & kids activities' },
            { time: '7:00pm', what: 'Carols show' }
          ],
          highlights: ['Photos with Santa', 'Kids activities', 'Candles & glow sticks', 'Food trucks', 'Face painting', 'Fun for all ages'],
          address: '57 Darley Road, Paradise',
          mapsQuery: '57 Darley Road, Paradise SA',
          website: 'https://www.futures.church'
        },
        { id: 'copper-coast', name: 'Copper Coast' },
        { id: 'victor-harbor', name: 'Victor Harbor' },
        { id: 'adelaide-city', name: 'Adelaide City' },
        { id: 'south', name: 'South (Old Reynella)' },
        { id: 'clare-valley', name: 'Clare Valley' }
      ];

      var picker = document.getElementById('picker');
      var panelsEl = document.getElementById('panels');
      var timer = null;

      function el(tag, cls, text) {
        var n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text != null) n.textContent = text;
        return n;
      }
      function fmt(iso, opts) {
        return new Intl.DateTimeFormat('en-AU', Object.assign({ timeZone: TZ }, opts)).format(new Date(iso));
      }
      function datesLine(loc) {
        var line = el('p', 'dates');
        loc.dates.forEach(function (d, i) {
          if (i) line.appendChild(el('em', null, '+'));
          line.appendChild(document.createTextNode(fmt(d.start, { weekday: 'long', day: 'numeric', month: 'long' })));
        });
        return line;
      }

      function buildCountdown(loc) {
        var first = new Date(loc.dates[0].start).getTime();
        // Event is over after the evening of the last date (assumed ~10pm).
        var last = new Date(loc.dates[loc.dates.length - 1].start).getTime() + 4.5 * 3600e3;
        var box = el('div');
        box.dataset.countdown = '1';
        function tick() {
          var now = Date.now(), diff = first - now;
          box.textContent = '';
          if (now > last) { box.appendChild(el('p', 'countdown-note', 'Thanks for celebrating with us. See you next year!')); return; }
          if (diff <= 0) { box.appendChild(el('p', 'countdown-note', 'It\u2019s on now. Come on down!')); return; }
          var wrap = el('div', 'countdown');
          wrap.setAttribute('role', 'timer');
          var s = Math.floor(diff / 1000);
          [['Days', Math.floor(s / 86400)], ['Hours', Math.floor(s % 86400 / 3600)], ['Mins', Math.floor(s % 3600 / 60)], ['Secs', s % 60]].forEach(function (u) {
            var cell = el('div', 'unit');
            cell.appendChild(el('b', null, String(u[1]).padStart(2, '0')));
            cell.appendChild(el('span', null, u[0]));
            wrap.appendChild(cell);
          });
          box.appendChild(wrap);
        }
        tick();
        box.tick = tick;
        return box;
      }

      function buildPanel(loc) {
        var p = el('article', 'panel');
        p.id = loc.id; p.hidden = true;
        p.appendChild(el('h3', null, loc.name));
        p.appendChild(el('p', 'sub', 'Futures Carols 2026'));

        if (!loc.dates) {
          var dl = el('dl', 'details');
          ['Date', 'Time', 'Venue', 'Address'].forEach(function (k) {
            var d = el('div');
            d.appendChild(el('dt', null, k));
            d.appendChild(el('dd', 'tbc', 'To be confirmed'));
            dl.appendChild(d);
          });
          p.appendChild(dl);
          return p;
        }

        p.appendChild(buildCountdown(loc));
        p.appendChild(datesLine(loc));

        var sched = el('ul', 'schedule');
        loc.schedule.forEach(function (it) {
          var li = el('li');
          li.appendChild(el('span', 'time', it.time));
          li.appendChild(el('span', 'what', it.what));
          sched.appendChild(li);
        });
        p.appendChild(sched);

        var chips = el('ul', 'chips');
        loc.highlights.forEach(function (h) { chips.appendChild(el('li', null, h)); });
        p.appendChild(chips);

        var where = el('p', 'where');
        where.appendChild(el('strong', null, 'Where'));
        where.appendChild(document.createTextNode(loc.address));
        p.appendChild(where);

        var actions = el('div', 'actions');
        var dir = el('a', 'btn', 'Get directions');
        dir.href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(loc.mapsQuery);
        dir.target = '_blank'; dir.rel = 'noopener';
        actions.appendChild(dir);
        var web = el('a', 'btn ghost', 'futures.church');
        web.href = loc.website; web.target = '_blank'; web.rel = 'noopener';
        actions.appendChild(web);
        p.appendChild(actions);
        return p;
      }

      LOCATIONS.forEach(function (loc) {
        var li = el('li', loc.featured ? 'featured' : null);
        var b = el('button', null, loc.name);
        b.type = 'button';
        b.setAttribute('aria-expanded', 'false');
        b.setAttribute('aria-controls', loc.id);
        li.appendChild(b);
        picker.appendChild(li);
        panelsEl.appendChild(buildPanel(loc));
      });

      function show(id) {
        clearInterval(timer);
        document.querySelectorAll('.panel').forEach(function (p) { p.hidden = p.id !== id; });
        document.querySelectorAll('.picker button').forEach(function (b) {
          b.setAttribute('aria-expanded', String(b.getAttribute('aria-controls') === id));
        });
        var cd = id && document.querySelector('#' + id + ' [data-countdown]');
        if (cd) timer = setInterval(cd.tick, 1000);
      }

      picker.addEventListener('click', function (e) {
        var b = e.target.closest('button');
        if (!b) return;
        var id = b.getAttribute('aria-controls');
        var open = b.getAttribute('aria-expanded') === 'true';
        show(open ? null : id);
        if (!open) document.getElementById(id).scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      });
    })();
  </script>
</body>
</html>
